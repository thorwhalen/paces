[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "paces"
version = "0.0.7"
description = "Turn instructional media into structured, interactive learning material"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "instructional-video",
    "segmentation",
    "learning-material",
    "practice",
    "steps",
    "dance",
    "tutorial",
]
authors = [
    { name = "Thor Whalen" },
]
dependencies = [
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/thorwhalen/paces"
Repository = "https://github.com/thorwhalen/paces"
Documentation = "https://thorwhalen.github.io/paces"

[project.scripts]
paces = "paces.__main__:main"

[project.optional-dependencies]
cli = ["cw>=0.1.1,<0.2", "argcomplete>=3"]
audio = [
    # Grid measurement (issue #2): the fleet's `mixing` owns speech/music
    # segmentation and beat tracking; [beats] pulls librosa, [audio] pulls
    # soundfile. Floor 0.0.36: `beat_grid` and `find_segments(strategy=
    # "speech_music")` ship there.
    "mixing[beats,audio]>=0.0.36",
    # librosa resolves numba transitively; without an explicit floor uv can
    # backtrack to unbuildable numba 0.53/llvmlite 0.36 when the newest
    # numpy outruns numba's caps.
    "numba>=0.59",
    # pydub (via mixing[audio]) imports the stdlib `audioop`, removed in
    # Python 3.13; the official backport keeps 3.13+ installs working.
    "audioop-lts; python_version>='3.13'",
]
media = [
    # Media derivation (issue #1, ADR-0005): clip cutting (crop_video +
    # crop_box), palette-quality gifs (make_gif) and posters (save_frame)
    # all run on the pip-bundled imageio-ffmpeg binary — no system ffmpeg.
    # Floor 0.0.39: make_gif, crop_box= and path-accepting
    # get_video_dimensions ship there.
    "mixing>=0.0.39",
]
# The pointable subject_locator (issue #15, ADR-0005 §3): rtmlib pose boxes,
# reached through `paces.pose:rtmlib_pose`. rtmlib is Apache-2.0 and its whole
# runtime closure (numpy, opencv, onnxruntime, tqdm) is permissive; its bundled
# RTMDet detector means person boxes need no YOLO even for detection. A
# YOLO/ultralytics dependency is barred from EVERY extra here — AGPL-3.0, whose
# §13 network clause reaches served users, not only people handed a copy — and
# tests/test_pose.py is what notices if that ever stops being true.
# onnxruntime is named rather than left to rtmlib's transitive closure: it is
# the backend= this locator asks for by name, not an incidental fact.
# Not mirrored into [dev] on purpose: the tests are offline and stay on fake
# locators (no weights, no network), and rtmlib declares opencv-python next to
# the opencv-contrib-python that mixing already brings — two distributions for
# one cv2, which CI has no reason to take on. `check_pose_requirements()`
# reports that pair when it happens.
pose = [
    "rtmlib",
    "onnxruntime",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    # The CLI smoke test runs `python -m paces ...`; without cw in dev it
    # would fail rather than silently skip — keep it mirrored with [cli].
    "cw>=0.1.1,<0.2",
    # The grid-measurement tests exercise the real mixing/librosa path on
    # synthesized audio; mirrored with [audio] so they run rather than skip.
    # The derivation tests do the same on synthetic video — mirrored with
    # [media] (the >=0.0.39 floor wins over [audio]'s >=0.0.36).
    "mixing[beats,audio]>=0.0.39",
    "numba>=0.59",
    # tests/test_pose.py reads pyproject.toml to guard the licence perimeter;
    # stdlib tomllib is 3.11+, and a skipped guard guards nothing.
    "tomli>=2.0; python_version < '3.11'",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

# System ffmpeg (ADR-0005 §2's trigger, fired by the vertical slice test:
# measure_grid on an .mp4 goes through pydub/librosa's PATH-ffmpeg, which the
# pip-bundled imageio-ffmpeg binary cannot serve). Consumed by wads CI's
# install-system-deps on the Linux AND Windows legs; install.macos serves
# local dev. Shape mirrors mixing's block.
[tool.wads.ops.ffmpeg]
description = "Multimedia framework for video/audio processing"
url = "https://ffmpeg.org/"
check.linux = "which ffmpeg"
check.macos = "which ffmpeg"
check.windows = "which ffmpeg"
install.linux = ["sudo apt-get update", "sudo apt-get install -y ffmpeg"]
install.macos = "brew install ffmpeg"
install.windows = "choco install ffmpeg -y --no-progress"

# --------------------------------------------------------------------------
# Licence adjudication
#
# paces is MIT and its core dependency is pydantic alone, so `pip install
# paces` pulls nothing copyleft. Neither does any extra: `pose` is rtmlib
# (Apache-2.0) + onnxruntime (MIT), and the AGPL alternative for that job
# (ultralytics) is barred outright rather than quarantined — kodokan needs a
# `track` extra because Ultralytics' tracker is genuinely load-bearing there;
# paces needs boxes, and rtmlib's bundled RTMDet gives them. There is
# therefore nothing to adjudicate, and no [tool.wads.licence.exceptions]
# table: an entry appearing here later would mean the perimeter moved.
#
# `include-extras` makes the check look where the exposure is — a check that
# reads only hard dependencies would report paces clean, which is correct and
# incomplete. `allowed`/`forbidden` are deliberately unset: they REPLACE wads'
# defaults rather than extend them, so re-stating the permissive families here
# would silently narrow the policy every time wads widens it.
#
# `enabled` stays false until the gate ships in a released wads and the extras'
# closures have been walked with it once; flipping it is a one-line change.
# Until then the perimeter is enforced by tests/test_pose.py, which runs in CI.
# --------------------------------------------------------------------------
[tool.wads.licence]
enabled = false
include-extras = ["cli", "audio", "media", "pose"]

[tool.hatch.build.targets.wheel]
packages = ["paces"]

[tool.hatch.build.targets.sdist]
include = [
    "paces",
    "tests",
    "README.md",
    "LICENSE",
    # the POC span table the round-trip test validates the schema against
    "docs/poc-reference/artifacts/clips.json",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.install]
extras = "dev"

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
